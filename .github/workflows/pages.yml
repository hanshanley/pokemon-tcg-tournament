name: Build and verify tournament Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tournament-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --locked
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx playwright install --with-deps chromium
      - name: Fetch public sources and build pinned executable rules
        run: uv run --locked python -m tournament.pages --data-dir data --output dist --refresh
      - run: uv run --locked ruff check tournament tests && uv run --locked ruff format --check tournament tests
      - run: uv run --locked pytest
      - run: npm run check && npm run test:engine
      - run: npm run test:e2e && npm run test:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: tournament-pages-preview
          path: dist
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: test-results

  deploy:
    if: vars.PAGES_ENABLED == 'true' && vars.PAGES_DOMAIN == 'themarginoferror.com'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Require an explicitly approved publication domain
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          HOST="$(gh api "repos/$REPOSITORY/pages" --jq '.html_url | split("/")[2] | ascii_downcase')"
          case "$HOST" in
            themarginoferror.com|*.themarginoferror.com) ;;
            *) echo "::error::Pages publication is not allowed on this hostname."; exit 1 ;;
          esac
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v5
        id: deployment

  record-status:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PUBLISHER: ${{ github.repository_owner }}
      PUBLISHER_ID: ${{ github.repository_owner_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tournament-pages-preview
          path: verified-site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record verified source status at most weekly
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { gunzipSync } from 'node:zlib';
          const path = '.github/current-format.json';
          const previous = existsSync(path) ? JSON.parse(readFileSync(path, 'utf8')) : null;
          if (!previous || Date.now() - Date.parse(previous.recorded_at) >= 7 * 86400000) {
            const root = 'verified-site/data/';
            const manifest = JSON.parse(readFileSync(root + 'manifest.json', 'utf8'));
            const snapshot = JSON.parse(gunzipSync(readFileSync(root + manifest.catalog)));
            const policy = snapshot.policy;
            const status = {
              recorded_at: new Date().toISOString(),
              source_commit: snapshot.source_commit,
              card_count: snapshot.card_count,
              policy_id: policy.id,
              legal_marks: policy.legal_marks.join(' '),
              verified_at: policy.verification.checked_at,
              valid_until: policy.verification.valid_until,
              handbook_sha256: policy.verification.handbook_sha256,
            };
            writeFileSync(path, JSON.stringify(status, null, 2) + '\n');
          }
          JS
          git add .github/current-format.json
          if git diff --cached --quiet -- .github/current-format.json; then exit 0; fi
          git config user.name "$PUBLISHER"
          git config user.email "$PUBLISHER_ID+$PUBLISHER@users.noreply.github.com"
          git commit -m "Record verified current Standard sources [skip ci]"
          git push origin HEAD:main
